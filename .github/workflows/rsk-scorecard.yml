# OpenSSF Scorecard — continuous, whole-repo security-posture monitor. Catches
# regressions across many axes (pinned deps, token permissions, dangerous
# workflows, branch protection, vulnerabilities, …) that one-off manual
# hardening can't guard against. Analysis only — no code/dependency changes,
# so zero divergence from upstream.
#
# Fork notes: publish_results is OFF (we monitor internally, we don't advertise
# the fork's posture). The absolute 0-10 score is muddied by upstream-owned
# checks (signed-releases, fuzzing, maintained, …) — read it for the
# RSK-controllable deltas, not the number. Analyzes the default branch
# (rsk/develop).
name: rsk-scorecard

on:
  push:
    branches: [rsk/develop]
  branch_protection_rule:
  schedule:
    # Sundays and Thursdays 02:30 UTC. push + branch_protection_rule already
    # cover repo-state changes; this cron catches external drift (e.g. a new CVE
    # flipping the Vulnerabilities check).
    - cron: '30 2 * * 0,4'
  workflow_dispatch:

# Default to read-only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false   # internal monitoring; don't publish the fork's posture

      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Public repo → code scanning is available for free (no paid Advanced Security).
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: results.sarif
