# Enforce the PR template checkboxes. A PR cannot merge while any box of the
# template is missing from the PR body or unticked: the author's "Before you open
# this", the reviewer's "For the reviewer" and the merger's "For the merger". The
# check reads the box state in the PR body, not who ticked it. (Only rsk/**
# bases; the develop/main upstream mirrors are intentionally excluded.)
#
# Ticking a box edits the body, which fires `edited` and re-runs the check.
# Drafts skip it, so the gate applies once the PR is ready for review.
name: rsk-pr-checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [rsk/**]

permissions:
  contents: read # the template on the base branch

# Each ticked box fires `edited`. Only the newest run's result matters.
concurrency:
  group: rsk-pr-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist:
    # A skipped job counts as passing for a required check, so drafts and
    # Dependabot PRs are not blocked. Dependabot bodies carry their own
    # checkboxes and never fill this template.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the template checkboxes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Read from the base branch, so a PR cannot drop a box by editing the
          # template it is checked against.
          template=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/.github/PULL_REQUEST_TEMPLATE.md?ref=$BASE_SHA")

          # One line per box: heading, open or ticked, text. The \r strip covers
          # CRLF bodies edited in a browser. Boxes in an HTML comment or a code
          # fence do not render, so they do not count. A fence closes only with
          # its own character, at least as long and with nothing after it, as
          # in CommonMark, so a shorter or other fence inside it does not end it.
          boxes() {
            awk '
              { sub(/[ \t\r]+$/, "") }
              incomment { if (index($0, "-->")) incomment = 0; next }
              {
                fence = ""
                if (match($0, /^ ? ? ?(```+|~~~+)/)) {
                  fence = substr($0, RSTART, RLENGTH)
                  sub(/^ +/, "", fence)
                }
              }
              infence != "" {
                if (fence != "" && substr(fence, 1, 1) == substr(infence, 1, 1) &&
                    length(fence) >= length(infence) && substr($0, RSTART + RLENGTH) == "")
                  infence = ""
                next
              }
              fence != "" { infence = fence; next }
              /^[[:space:]]*<!--/ && !index($0, "-->") { incomment = 1; next }
              /^##? / { heading = $0; next }
              heading != "" && match($0, /^[[:space:]]*([-*+]|[0-9]+[.)]) \[[ xX]\]([[:space:]]|$)/) {
                box = substr($0, RSTART, RLENGTH)
                text = substr($0, RSTART + RLENGTH)
                sub(/^[[:space:]]+/, "", text)
                # Indented 4 or more (a tab counts 4), a line can render as a
                # code block. The template boxes are top-level, so such a
                # ticked box never stands for one; an open one still blocks.
                match($0, /^[ \t]*/)
                indent = substr($0, 1, RLENGTH)
                gsub(/\t/, "    ", indent)
                state = box ~ /\[ \]/ ? "open" : (length(indent) < 4 ? "ticked" : "deep")
                print heading "\t" state "\t" text
              }
            '
          }

          want=$(boxes <<<"$template" | cut -f1,3)
          if [ -z "$want" ]; then
            echo "::error::the template on the base branch has no checkboxes"
            exit 1
          fi
          have=$(boxes <<<"$PR_BODY")

          status=0
          while IFS=$'\t' read -r heading text; do
            if ! grep -qFx -e "$heading"$'\t'ticked$'\t'"$text" <<<"$have"; then
              echo "::error::missing or unticked in '$heading': $text"
              status=1
            fi
          done <<<"$want"

          # Every other open box in a template section blocks too: one someone
          # added, or an unticked copy of a template box that is ticked elsewhere.
          # An unticked template box with no ticked copy is reported above.
          headings=$(cut -f1 <<<"$want" | sort -u)
          while IFS=$'\t' read -r heading state text; do
            if [ "$state" = open ] && grep -qFx -e "$heading" <<<"$headings"; then
              if ! grep -qFx -e "$heading"$'\t'"$text" <<<"$want" ||
                grep -qFx -e "$heading"$'\t'ticked$'\t'"$text" <<<"$have"; then
                echo "::error::unticked in '$heading': $text"
                status=1
              fi
            fi
          done <<<"$have"

          if [ "$status" -eq 0 ]; then
            echo "ok: every template checkbox is ticked"
          fi
          exit "$status"
