# RSK per-MODULE release: build + push a single component image and cut a GitHub
# Release when an annotated `rsk/<module>/vX.Y.Z` tag is pushed. The `rsk/`
# prefix keeps RSK release tags in their own namespace so they never collide
# with the `<module>/v*` tags inherited from upstream Optimism.
#
# For the common case — all components together at one fork version — use
# `rsk-release.yml` (whole-fork: builds every image + tags `rsk/vX.Y.Z`). This
# per-module path ships a single component on its own version. All RSK-own tags
# live under `rsk/`: whole-fork `rsk/vX.Y.Z` + per-module `rsk/<module>/vX.Y.Z`.
name: rsk-release-module

on:
  push:
    tags:
      - 'rsk/*/v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Parse tag
        id: tag
        run: |
          ref="${GITHUB_REF#refs/tags/}"   # e.g. rsk/op-node/v1.2.3
          rest="${ref#rsk/}"               # op-node/v1.2.3
          component="${rest%%/*}"          # op-node
          version="${rest#*/}"             # v1.2.3
          case "$component" in
            op-node|op-batcher|op-proposer|op-deployer) ;;
            *)
              echo "Component '$component' is not configured for releases; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute build metadata
        if: steps.tag.outputs.skip != 'true'
        id: meta
        run: |
          echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.tag.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.tag.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.tag.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.tag.outputs.skip != 'true'
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: ${{ steps.tag.outputs.component }}
          push: true
          set: |
            *.platform=linux/amd64,linux/arm64
        env:
          REGISTRY: ghcr.io
          REPOSITORY: ${{ github.repository_owner }}
          IMAGE_TAGS: ${{ steps.tag.outputs.version }}
          GIT_VERSION: ${{ steps.tag.outputs.version }}
          GIT_COMMIT: ${{ steps.meta.outputs.git_commit }}
          GIT_DATE: ${{ steps.meta.outputs.git_date }}
          PLATFORMS: linux/amd64,linux/arm64

      - name: Create GitHub Release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.ref }}
          tag_name: ${{ steps.tag.outputs.ref }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
