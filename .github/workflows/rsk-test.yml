# Scoped Go tests for the packages the RSK fork diverges from upstream in.
#
# Runs on every PR to rsk/** (and on push to rsk/develop). A single `go test` over
# the package paths below covers two things at once: upstream's existing tests, as
# a regression guard that the fork's changes don't break them, and the fork's own
# `_rsk_test.go` files, which sit in those same packages and so are picked up by
# the same invocation. That RSK-specific coverage landed in PAYROLLUP-79; see
# AGENTS_rsk.md for the `_rsk_test.go` / `TestRSK_` convention.
#
# The repo is a single Go module at the root, so one `go test` with explicit
# package paths is enough.
#
# op-deployer/pkg/deployer/forge is EXCLUDED here: its tests invoke the `forge`
# binary (Foundry) and compile Solidity, so they need a Foundry-enabled runner.
# That job exists separately, in rsk-contracts-test.yml.
name: rsk-test

on:
  pull_request:
    branches: [rsk/**]
  push:
    branches: [rsk/develop]

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SHA-pinned for supply-chain safety (matches the other rsk-* workflows).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test RSK-divergent packages
        run: |
          go test -timeout 15m \
            ./op-node/rollup/derive/... \
            ./op-node/node/... \
            ./op-service/sources/... \
            ./op-service/txmgr/... \
            ./op-deployer/pkg/deployer/broadcaster/... \
            ./op-proposer/contracts/...
