# Dependabot for the RSK fork.
#
# github-actions — routine version updates for the actions in our workflows
# (we own them, so bumping them doesn't diverge from upstream).
#
# gomod — NO routine version updates (open-pull-requests-limit: 0; Go deps are
# upstream-owned, inherited via upstream sync — bumping them here would diverge
# the fork). This entry exists ONLY so Dependabot *security* updates for go.mod
# inherit the chore(deps) title and pass the rsk-pr-title check. It stays dormant
# until the org enables Dependabot alerts + security updates; detection meanwhile
# is govulncheck (rsk-govulncheck.yml). Fixes: upstream sync or a targeted patch.
#
# Lives on rsk/develop (the default branch — Dependabot reads config from there)
# and doubles as the RSK override if an upstream sync reintroduces upstream's own
# dependabot.yml.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"                    # scans .github/workflows/
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10                # wait 10 days after a release before proposing it (supply-chain safety)
    commit-message:
      prefix: "chore"                 # -> "chore(deps): ..." keeps titles Conventional-Commits compliant
      include: "scope"
    groups:
      github-actions:                 # one grouped PR instead of one per action
        patterns:
          - "*"

  # Why we keep this entry even though it does NO version updates:
  #   Dependabot has two independent PR systems — version updates (routine
  #   freshness, configured here) and security updates (CVE fixes, driven by
  #   Dependabot alerts). `open-pull-requests-limit` caps ONLY the first.
  #   Per GitHub docs, security updates have a separate internal limit of 10 PRs
  #   that this option cannot change — so limit: 0 turns OFF routine go.mod bumps
  #   (we don't chase freshness on upstream-owned deps; they come via sync) while
  #   CVE PRs still open. This entry's only job is to give those security PRs the
  #   chore(deps) title so they pass the rsk-pr-title check. Dormant until the org
  #   enables Dependabot security updates.
  - package-ecosystem: "gomod"
    directory: "/"                    # root Go module (deployed op-node/batcher/proposer/deployer)
    schedule:
      interval: "weekly"             # required key; inert here (it sets version-update cadence, which is off)
    open-pull-requests-limit: 0       # 0 = no version updates; security updates unaffected (separate 10-PR limit)
    commit-message:
      prefix: "chore"                 # -> "chore(deps): ..." on the security PRs (no cooldown: don't delay a CVE fix)
      include: "scope"
